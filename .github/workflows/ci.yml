name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install the project
        run: python -m pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: python -m mypy

  test:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install the project with development extras
        run: python -m pip install -e ".[dev]"

      - name: CLI starts
        run: songlab --help

      - name: Environment report
        run: songlab doctor

      - name: Run the test suite
        run: python -m pytest -q

  # Integration tests use real FFmpeg. They are skipped automatically when the
  # tool is missing, but this job proves they actually run on Linux.
  integration:
    name: Integration (Ubuntu, FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg

      - name: Install the project with development extras
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run integration tests
        run: python -m pytest -m integration -q
