[build-system]
# setuptools>=77 understands the PEP 639 SPDX license expression below.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "song-chord-lyrics-analyzer"
dynamic = ["version"]
description = "Cross-platform song analysis laboratory: synchronized lyrics, chords, key, tempo and beats"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Song Chord Lyrics Analyzer contributors" }]
keywords = ["audio", "chords", "lyrics", "music-information-retrieval", "tempo", "key"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Sound/Audio :: Analysis",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
# Core installation intentionally has zero required dependencies.
# Analysis engines are optional and are added in later roadmap phases.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.5",
    "mypy>=1.10",
]
# Optional DSP stack used by the chord/key/tempo engines. Kept out of the
# required dependencies so `songlab info` and `songlab doctor` work on a bare
# install; see docs/DEPENDENCY_MATRIX.md for the licence audit.
dsp = [
    "numpy>=1.24",
    "librosa>=0.10",
    "soundfile>=0.12",
]
# Optional playback backend (roadmap Phase A). sounddevice is MIT and binds the
# system PortAudio through cffi; numpy is needed for the stream callback buffer.
playback = [
    "numpy>=1.24",
    "sounddevice>=0.5",
]
# Optional desktop window (roadmap Phase D). PyQt6 is GPL-3.0/commercial and
# GPL-3.0-or-later compatible for this project; see docs/LICENSE_AUDIT.md. It is
# an extra so the core install, the test matrix and the CI gate stay Qt-free,
# and so `songlab gui` can report an honest dependency error instead of failing
# to import at all. The window needs the dsp and playback extras as well.
gui = [
    "PyQt6>=6.5",
]

[project.scripts]
songlab = "song_chord_lyrics_analyzer.cli.main:main"

[project.urls]
Homepage = "https://github.com/song-chord-lyrics-analyzer/song-chord-lyrics-analyzer"
Issues = "https://github.com/song-chord-lyrics-analyzer/song-chord-lyrics-analyzer/issues"

[tool.setuptools.dynamic]
version = { attr = "song_chord_lyrics_analyzer.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
song_chord_lyrics_analyzer = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
addopts = "-ra"
# external/ holds third-party reference repositories (git submodules), never tests
# of this project. They must not be collected even for an explicit `pytest .`.
norecursedirs = [".*", "build", "dist", "external"]
markers = [
    "integration: tests that require external tools (FFmpeg) or heavy models",
    "slow: tests that take a long time to run",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]
# Documentation holds illustrative snippets (including the ROADMAP) that must
# never be rewritten by the formatter.
# external/ holds third-party reference repositories (git submodules): study
# material only, never linted or reformatted by this project.
extend-exclude = ["*.md", "external"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = [
    "RUF001",
    "RUF002",
    "RUF003",
    # __all__ lists are ordered by meaning (models grouped by concern), not
    # alphabetically, which keeps the public surface readable.
    "RUF022",
]

[tool.mypy]
python_version = "3.10"
files = ["src"]
# Defence in depth: external/ holds third-party reference repositories and must
# never be type-checked as part of this project.
exclude = ["^external/"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
